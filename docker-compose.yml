services:
  db:
    image: mysql:8.4
    container_name: mssnaatu-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mssnaatu
      MYSQL_USER: mssnaatu
      MYSQL_PASSWORD: mssnaatu
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
