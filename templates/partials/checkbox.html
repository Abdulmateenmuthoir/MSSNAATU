<label for="{{ field.id_for_label }}" class="flex cursor-pointer items-start gap-3 rounded-xl border border-line bg-surface2/50 px-4 py-3 transition hover:border-brand/30">
  {{ field }}
  <span class="min-w-0">
    <span class="block text-[13px] font-semibold text-ink">{{ field.label }}</span>
    {% if field.help_text %}<span class="mt-0.5 block text-xs leading-5 text-muted">{{ field.help_text }}</span>{% endif %}
    {% for error in field.errors %}<span class="mt-1 block text-xs font-semibold text-danger">{{ error }}</span>{% endfor %}
  </span>
</label>
