<div class="field-group">
  <label for="{{ field.id_for_label }}" class="field-label">
    {{ field.label }}{% if field.field.required %}<span class="ml-0.5 text-danger">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p class="field-help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="field-error"><span aria-hidden="true">●</span> {{ error }}</p>{% endfor %}
</div>
