{% load static %}
<section id="newsletter" class="bg-[#f2f8ef] py-16 dark:bg-[#141619] sm:py-20">
  <div class="container-page">
    <div class="rounded-[2rem] border border-line bg-surface p-3 shadow-soft sm:p-5">
      <div class="rounded-[1.6rem] border-2 border-dashed border-[#ef5549] bg-[#eff9ec] px-5 py-10 dark:border-[#dc716b] dark:bg-[#202328] sm:px-8 lg:px-10 lg:py-12">
        <div class="grid items-center gap-10 lg:grid-cols-[1.05fr_0.95fr] lg:gap-14">
          <div>
            <p class="text-xs font-bold uppercase tracking-[0.18em] text-brand">MSSN AATU newsletter</p>
            <h2 class="mt-4 max-w-lg font-sans text-3xl font-extrabold leading-tight tracking-tight text-ink sm:text-4xl">Good things in your inbox, <span class="text-[#ef5549]">for free.</span></h2>
            <p class="mt-3 text-sm leading-6 text-muted">Society news, programme announcements and useful campus updates. No spam, just the things our members need to know.</p>

            <form method="post" action="{% url 'core:newsletter_subscribe' %}" class="mt-7">
              {% csrf_token %}
              <div class="grid gap-4 sm:grid-cols-2">
                <div>
                  <label for="newsletter-name" class="field-label">Name</label>
                  <input id="newsletter-name" name="name" type="text" maxlength="120" autocomplete="name" placeholder="Enter your full name" class="field-input !rounded-lg !bg-white dark:!bg-[#17191d]">
                </div>
                <div>
                  <label for="newsletter-email" class="field-label">Email address <span class="text-danger">*</span></label>
                  <input id="newsletter-email" name="email" type="email" maxlength="254" required autocomplete="email" placeholder="you@example.com" class="field-input !rounded-lg !bg-white dark:!bg-[#17191d]">
                </div>
              </div>
              <button type="submit" class="mt-4 w-full rounded-lg bg-[#860039] px-5 py-3.5 text-sm font-extrabold uppercase tracking-wide text-white transition hover:bg-[#6f0030] focus-visible:outline-offset-4 dark:bg-[#b63d71] dark:hover:bg-[#c85182]">Subscribe</button>
            </form>
            <p class="mt-4 text-xs leading-5 text-muted">Open to every student. We’ll only use your email for MSSN AATU updates.</p>
          </div>

          <div class="relative mx-auto w-full max-w-[390px]" aria-hidden="true">
            <svg class="h-auto w-full" viewBox="0 0 420 300" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="118" y="38" width="252" height="206" rx="32" fill="#D8ECFF"/>
              <path d="M145 111 244 185l99-74v99a20 20 0 0 1-20 20H165a20 20 0 0 1-20-20v-99Z" fill="#FF8B47"/>
              <path d="m145 112 99 71 99-71" stroke="#F8A536" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M219 91c-16-22-48-3-30 18l30 31 30-31c18-21-14-40-30-18Z" fill="#F00659"/>
              <path d="M294 130c-22-30-65-4-40 25l40 41 40-41c25-29-18-55-40-25Z" fill="#F00659"/>
              <rect x="25" y="174" width="264" height="102" rx="27" fill="white"/>
              <path d="m28 201 70 57 70-57" stroke="#E8E9ED" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M26 207v43a26 26 0 0 0 26 26h91a26 26 0 0 0 26-26v-43l-71 56-72-56Z" fill="#F5F6F8"/>
              <rect x="161" y="204" width="111" height="12" rx="6" fill="#E1E3E8"/>
              <rect x="161" y="229" width="83" height="10" rx="5" fill="#EEEFF2"/>
              <rect x="161" y="251" width="100" height="10" rx="5" fill="#EEEFF2"/>
              <circle cx="58" cy="180" r="17" fill="#E9F7E7"/>
              <path d="M58 174v12m-6-6h12" stroke="#168247" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
