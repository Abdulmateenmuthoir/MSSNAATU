{% if messages %}
<div class="pointer-events-none fixed inset-x-4 bottom-4 z-[90] flex flex-col items-end gap-2 sm:left-auto sm:right-6 sm:bottom-6 sm:w-[380px]" data-toast-stack>
  {% for message in messages %}
    <div class="pointer-events-auto w-full animate-rise rounded-2xl border bg-surface p-4 shadow-lift
      {% if message.tags == 'success' %}border-success/25{% elif message.tags == 'error' %}border-danger/25{% elif message.tags == 'warning' %}border-gold/35{% else %}border-line{% endif %}"
      role="status" data-toast>
      <div class="flex items-start gap-3">
        <span class="mt-0.5 grid h-6 w-6 shrink-0 place-items-center rounded-full
          {% if message.tags == 'success' %}bg-success/10 text-success{% elif message.tags == 'error' %}bg-danger/10 text-danger{% elif message.tags == 'warning' %}bg-goldsoft text-gold{% else %}bg-brandsoft text-brand{% endif %}">
          {% if message.tags == 'success' %}
            <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          {% elif message.tags == 'error' %}
            <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 8v5M12 16.5v.5" stroke-linecap="round"/><circle cx="12" cy="12" r="9"/></svg>
          {% else %}
            <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 11v5M12 7.5v.5" stroke-linecap="round"/><circle cx="12" cy="12" r="9"/></svg>
          {% endif %}
        </span>
        <p class="min-w-0 flex-1 text-[13px] font-semibold leading-5 text-ink">{{ message }}</p>
        <button type="button" data-toast-close class="text-muted transition hover:text-ink" aria-label="Dismiss">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  {% endfor %}
</div>
{% endif %}
