{% extends "base_auth.html" %}
{% block title %}Password updated · {{ site_name }}{% endblock %}

{% block auth_content %}
<div class="text-center">
  <div class="mx-auto grid h-16 w-16 place-items-center rounded-full bg-success/10 text-success">
    <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h1 class="mt-6 font-display text-2xl font-semibold tracking-tight text-ink sm:text-3xl">You're all set.</h1>
  <p class="mt-3 text-sm leading-6 text-muted">Your password has been updated. Sign in with your new password to return to your dashboard.</p>
  <a href="{% url 'accounts:login' %}" class="btn-primary mt-8 w-full">Sign in</a>
</div>
{% endblock %}
